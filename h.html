<!DOCTYPE html>
<html>
<head>
  <title>Test KKiaPay Sandbox - Lotus Business</title>
  <script src="https://cdn.kkiapay.me/k.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; max-width: 620px; margin: auto; background: #f9f9f9; }
    h2 { margin-bottom: 20px; }
    label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 9px 10px; margin-bottom: 14px;
      box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;
      font-size: 14px; background: #fff;
    }
    input:focus, select:focus { outline: none; border-color: #4661b9; box-shadow: 0 0 0 2px #4661b922; }
    button {
      padding: 11px 22px; background: #4661b9; color: white;
      border: none; border-radius: 5px; cursor: pointer; margin: 4px 4px 4px 0;
      font-size: 14px; transition: background 0.2s;
    }
    button:hover { background: #3550a8; }
    button:disabled { background: #aaa; cursor: default; }
    #userInfo {
      display: none; background: #eef2ff; border: 1px solid #c7d2fe;
      border-radius: 6px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px;
    }
    #userInfo .info-row { margin: 3px 0; }
    #userInfo .info-row span { color: #4661b9; font-weight: bold; }
    #userInfo .loading { color: #888; font-style: italic; }
    #userInfo .error { color: #e53e3e; }
    #result {
      margin-top: 20px; padding: 14px; background: #f5f5f5;
      border-radius: 6px; white-space: pre-wrap; word-break: break-all; font-size: 13px;
    }
    .success { color: #276749; } .error-text { color: #c53030; }
    hr { border: none; border-top: 1px solid #ddd; margin: 18px 0; }
    .section-title { font-size: 12px; text-transform: uppercase; color: #888; letter-spacing: 0.05em; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>🧪 Test KKiaPay Sandbox - Lotus Business</h2>

  <!-- Section 1 : Token admin pour lookup utilisateur -->
  <p class="section-title">1. Authentification admin</p>
  <label>Token JWT Admin</label>
  <input id="adminToken" type="text" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." />

  <hr>

  <!-- Section 2 : Recherche utilisateur -->
  <p class="section-title">2. Utilisateur à upgrader</p>
  <label>User ID</label>
  <input
    id="userId"
    type="text"
    placeholder="ex: 5a684f93-87cc-4884-a9cd-bc7a882e47bd"
    onblur="fetchUserInfo()"
  />

  <!-- Carte infos utilisateur -->
  <div id="userInfo">
    <div class="loading">⏳ Chargement des infos utilisateur...</div>
  </div>

  <label>Token JWT User (pour /verify-and-upgrade)</label>
  <input id="userToken" type="text" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." />

  <hr>

  <!-- Section 3 : Paiement -->
  <p class="section-title">3. Paiement</p>
  <label>📱 Numéro de téléphone pour le paiement</label>
  <input
    id="phoneInput"
    type="text"
    placeholder="ex: 97000000 (8 chiffres sans indicatif)"
  />
  <small style="display:block;margin-top:-10px;margin-bottom:14px;color:#666;">
    ⚠️ KKiaPay attend <strong>8 chiffres</strong> sans indicatif (+229). Ex : <code>97000000</code>
  </small>
  <label>Type d'abonnement</label>
  <select id="subType">
    <option value="MONTHLY">Mensuel — 999 FCFA</option>
    <option value="ANNUAL">Annuel — 10 000 FCFA</option>
  </select>

  <button onclick="startPayment()" id="payBtn">💳 Lancer le paiement KKiaPay</button>

  <div id="result">En attente du paiement...</div>

  <script>
    const API = 'https://lotus-business-server.onrender.com';
    const PUBLIC_KEY = '73f962e0812611f1adc08d6852ca903c';

    // Données utilisateur récupérées
    let currentUser = null;

    async function fetchUserInfo() {
      const userId = document.getElementById('userId').value.trim();
      const adminToken = document.getElementById('adminToken').value.trim();
      const infoBox = document.getElementById('userInfo');

      if (!userId) { infoBox.style.display = 'none'; currentUser = null; return; }
      if (!adminToken) {
        infoBox.style.display = 'block';
        infoBox.innerHTML = '<div class="error">⚠️ Entre le token admin pour récupérer les infos utilisateur.</div>';
        return;
      }

      infoBox.style.display = 'block';
      infoBox.innerHTML = '<div class="loading">⏳ Chargement des infos utilisateur...</div>';

      try {
        const res = await fetch(`${API}/api/admin/users`, {
          headers: { 'Authorization': 'Bearer ' + adminToken }
        });

        if (!res.ok) {
          infoBox.innerHTML = '<div class="error">❌ Impossible de récupérer les utilisateurs (token admin invalide ?).</div>';
          currentUser = null;
          return;
        }

        const data = await res.json();
        const users = data.users || [];
        const user = users.find(u => u.id === userId);

        if (!user) {
          infoBox.innerHTML = '<div class="error">❌ Aucun utilisateur trouvé avec cet ID.</div>';
          currentUser = null;
          return;
        }

        currentUser = user;
        // Pré-remplir le champ numéro (8 chiffres locaux)
        const rawPhone = user.phone || '';
        const cleaned  = rawPhone.replace(/[\s\-\+]/g, '');
        const localPhone = cleaned.startsWith('229') ? cleaned.slice(3) : cleaned;
        document.getElementById('phoneInput').value = localPhone;

        infoBox.innerHTML = `
          <div class="info-row">👤 Nom : <span>${user.firstName} ${user.lastName}</span></div>
          <div class="info-row">📧 Email : <span>${user.email}</span></div>
          <div class="info-row">📱 Téléphone : <span>${user.phone || 'N/A'}</span></div>
          <div class="info-row">🎫 Licence : <span>${user.licenseType} — ${user.licenseStatus}</span></div>
        `;
      } catch (err) {
        infoBox.innerHTML = '<div class="error">❌ Erreur réseau : ' + err.message + '</div>';
        currentUser = null;
      }
    }

    function startPayment() {
      const userId  = document.getElementById('userId').value.trim();
      const subType = document.getElementById('subType').value;
      const amount  = subType === 'ANNUAL' ? 10000 : 999;

      if (!userId) { alert('⚠️ Entre un userId valide !'); return; }

      const fullname    = currentUser ? `${currentUser.firstName} ${currentUser.lastName}` : 'Test User';
      const email       = currentUser ? currentUser.email : 'test@lotus.com';
      // Numéro saisi/modifié manuellement par l'utilisateur
      const phoneNumber = document.getElementById('phoneInput').value.trim() || '97000000';

      openKkiapayWidget({
        amount,
        key:         PUBLIC_KEY,
        sandbox:     true,
        fullname,
        email,
        phoneNumber,
        data:        JSON.stringify({ userId, type: 'UPGRADE_PREMIUM', subscriptionType: subType }),
      });
    }

    // Paiement réussi → appel verify-and-upgrade
    addSuccessListener(async function(response) {
      const transactionId = response.transactionId;
      const token   = document.getElementById('userToken').value.trim();
      const subType = document.getElementById('subType').value;

      let html = '<h3 class="success">✅ Paiement réussi !</h3>';
      html += '<b>Transaction ID :</b> ' + transactionId + '\n\n';
      document.getElementById('result').innerHTML = html + '⏳ Vérification backend en cours...';

      if (!token) {
        document.getElementById('result').innerHTML = html +
          '⚠️ Pas de token JWT user → upgrade via webhook seulement.\n' +
          'Vérifie les logs Render pour voir si le webhook a été reçu.';
        return;
      }

      try {
        const res = await fetch(`${API}/api/payments/verify-and-upgrade`, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ transactionId, type: 'UPGRADE_PREMIUM', subscriptionType: subType }),
        });

        const data = await res.json();

        if (res.ok) {
          document.getElementById('result').innerHTML =
            '<h3 class="success">🎉 UPGRADE RÉUSSI !</h3>' +
            '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        } else {
          document.getElementById('result').innerHTML =
            '<h3 class="error-text">❌ Erreur backend</h3>' +
            '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        }
      } catch (err) {
        document.getElementById('result').innerHTML =
          '<h3 class="error-text">❌ Erreur réseau</h3>' + err.message;
      }
    });

    addFailedListener(function(response) {
      document.getElementById('result').innerHTML =
        '<h3 class="error-text">❌ Paiement échoué</h3>' +
        '<pre>' + JSON.stringify(response, null, 2) + '</pre>';
    });
  </script>
</body>
</html>
